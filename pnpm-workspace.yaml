packages:
  - 'apps/*'
  - 'packages/**/*'
allowBuilds:
  core-js: true
  esbuild: true
  unrs-resolver: false

# These tools need TypeScript's JavaScript API. Keep the project compiler on 7.0.2
# and give their dependency chains 5.9.3, which satisfies tsconfck's ^5 requirement
# and typescript-eslint's >=4.8.4 <6.1.0 requirement. Remove each extension when its
# tool supports the project compiler; do not widen upstream peer ranges.
packageExtensions:
  'eslint-plugin-storybook@10.6.3':
    dependencies:
      typescript: 5.9.3
  'vite-tsconfig-paths@5.1.4':
    dependencies:
      typescript: 5.9.3

# Transitive security fixes. These pin patched versions of packages reached only through
# tooling (eslint, @next/eslint-plugin-next, shadcn) and next's own pinned postcss/sharp.
# Drop an entry once its parent ships a patched range. Recorded in ADR-0001.
overrides:
  flatted: '^3.4.4'
  picomatch@<2.3.2: '^2.3.2'
  nanoid@<3.3.18: '^3.3.20'
  '@humanfs/node@<0.16.8': '^0.16.8'
  source-map-js@<1.2.2: '^1.2.2'
  sharp@<0.35.5: '^0.35.5'
  qs@>=6.7.0 <6.16.1: '^6.16.1'
  systeminformation@<5.33.16: '^5.33.16'

# No patched release of braces exists (latest 3.0.3 is affected). It is reached only through
# dev-time glob tooling (eslint-plugin-next's fast-glob, the shadcn CLI), never shipped to users.
# Accepted by the repository owner 2026-10-13. Remove this when a patched braces is published.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - postcss@8.5.30
  - '@chromatic-com/storybook@5.5.1'
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3

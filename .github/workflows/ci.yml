name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels an older run on the same pull request. On main a run
# that has started always finishes: it is the only run that saves the
# Turborepo cache, and merges in quick succession (Dependabot) otherwise
# cancelled every run but the last, so main was never verified or cached.
# GitHub still keeps at most one waiting run per group, so a burst queues
# only the newest commit behind the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # apps/web creates a Supabase client on every request (src/proxy.ts), so the
    # build and the end-to-end server need these set or every page returns 500.
    # They are placeholders, not credentials: no CI step contacts Supabase, and
    # `.env.local`, where real values live, is not in the repository. NEXT_PUBLIC_*
    # is passed to the web tasks by Turborepo's Next.js framework inference.
    # SITE_URL is the address the end-to-end server listens on, the same value
    # as apps/web/.env.example, so the web app resolves `metadataBase` from its
    # own setting instead of Next's localhost fallback. It is not a deployment
    # address; this build is never deployed.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SITE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo's local task cache. Every run restores the latest saved copy,
      # so unchanged tasks replay instead of re-running. Only pushes to main
      # save it (after `pnpm verify`): a pull request run's copy is visible only
      # to that pull request, and each one was about 300 MB of the 10 GB limit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Chromium is downloaded on every run otherwise. The browser follows the
      # Playwright version alone, so that is the key: keyed on the lockfile,
      # every dependency change saved another copy of the same browser. System
      # packages (`--with-deps`) are still installed each run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `pnpm install` does not download browsers. `pnpm verify` runs the web
      # end-to-end tests and the Storybook story tests, and both drive Chromium.
      # Every consumer pins the same Playwright version, so one install serves both.
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm verify

      # A restored copy is saved again with this run's entries added, so it
      # would keep every entry ever made. Restored files keep the time they were
      # first written: dropping those older than seven days bounds the copy, at
      # the cost of one rebuild for a task whose inputs have not changed since.
      - name: Drop week-old Turborepo cache entries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: if [ -d .turbo/cache ]; then find .turbo/cache -type f -mtime +7 -delete; fi
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # The committed database types must match what the migrations produce. Every
  # input is pinned: the migrations, the Supabase CLI (root devDependency, which
  # also fixes the Postgres image) and Prettier. So the diff fails only when a
  # migration changed without `pnpm db:types`, or a pinned tool changed in the
  # same pull request. It checks the types against the migrations, not against
  # the hosted project. No secrets and no hosted project are involved. Kept out
  # of `pnpm verify`, so a local push does not need Docker.
  db-types:
    name: db-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the local database
        run: pnpm exec supabase db start
      # Explicit, so the job does not depend on whether `db start` applied them.
      - name: Apply the migrations
        run: pnpm exec supabase migration up --local
      - name: Regenerate the database types
        run: pnpm db:types
      - name: Fail if the committed types differ
        run: git diff --exit-code -- packages/server/supabase/src/database-types/database.types.ts

  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PR title format and closing keywords
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          # Dependabot bodies quote upstream release notes that legitimately contain closing keywords.
          SKIP_BODY: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '1' || '0' }}
        run: .github/scripts/check-pr-text.sh

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=moderate
      # gitleaks runs as a checksum-verified binary, so no third-party action is trusted.
      - name: Secret scan (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # apps/web creates a Supabase client on every request (src/proxy.ts), so the
    # build and the end-to-end server need these set or every page returns 500.
    # They are placeholders, not credentials: no CI step contacts Supabase, and
    # `.env.local`, where real values live, is not in the repository. NEXT_PUBLIC_*
    # is passed to the web tasks by Turborepo's Next.js framework inference.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm install` does not download browsers. `pnpm verify` runs the web
      # end-to-end tests and the Storybook story tests, and both drive Chromium.
      # Every consumer pins the same Playwright version, so one install serves both.
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm verify

  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PR title format and closing keywords
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          # Dependabot bodies quote upstream release notes that legitimately contain closing keywords.
          SKIP_BODY: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '1' || '0' }}
        run: .github/scripts/check-pr-text.sh

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=moderate
      # gitleaks runs as a checksum-verified binary, so no third-party action is trusted.
      - name: Secret scan (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose
